<section id="experience" class="bg-ink-800/50 border-y border-white/5">
  <div class="max-w-6xl mx-auto px-6 py-24" appScrollReveal>
    @if (langService.currentLang() === 'es') {
      <p class="font-mono text-brand-400 text-sm mb-2">04. Trayectoria</p>
      <h2 class="text-3xl sm:text-4xl font-bold text-white mb-10">Experiencia laboral</h2>
    } @else {
      <p class="font-mono text-brand-400 text-sm mb-2">04. Journey</p>
      <h2 class="text-3xl sm:text-4xl font-bold text-white mb-10">Work Experience</h2>
    }

    <div class="relative border-l border-white/10 pl-8 space-y-10">
      <div *ngFor="let exp of experience" class="relative">
        <span class="absolute -left-[38px] top-1.5 h-3 w-3 rounded-full bg-brand-500 ring-4 ring-brand-500/20"></span>
        <p class="font-mono text-xs text-brand-400">{{ exp.period[langService.currentLang()] }}</p>
        <h3 class="text-lg font-bold text-white mt-1">
          {{ exp.role[langService.currentLang()] }} · {{ exp.company }}
        </h3>
        <p class="text-sm text-slate-500">{{ exp.location }}</p>
        
        <ul class="mt-3 space-y-2">
          <li *ngFor="let bullet of exp.bullets[langService.currentLang()]" class="flex gap-3 text-slate-300 text-sm leading-relaxed">
            <span class="text-brand-400 mt-1">▸</span>
            <span>{{ bullet }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
