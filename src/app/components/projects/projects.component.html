<section id="projects" class="max-w-6xl mx-auto px-6 py-24">
  <div appScrollReveal>
    @if (langService.currentLang() === 'es') {
      <p class="font-mono text-brand-400 text-sm mb-2">03. Proyectos</p>
      <h2 class="text-3xl sm:text-4xl font-bold text-white mb-10">Proyectos destacados (Cianet)</h2>
    } @else {
      <p class="font-mono text-brand-400 text-sm mb-2">03. Projects</p>
      <h2 class="text-3xl sm:text-4xl font-bold text-white mb-10">Featured Projects (Cianet)</h2>
    }

    <div class="grid gap-5">
      <div
        *ngFor="let project of projects"
        class="bg-ink-800 border border-white/10 rounded-2xl overflow-hidden transition-colors hover:border-brand-500/40"
      >
        <button
          (click)="toggle(project.id)"
          class="w-full text-left px-6 py-6 flex items-center justify-between gap-4"
        >
          <div>
            <h3 class="text-xl font-bold text-white">{{ project.title[langService.currentLang()] }}</h3>
            <p class="text-slate-400 mt-1 text-sm sm:text-base">
              {{ project.summary[langService.currentLang()] }}
            </p>
            <div class="flex flex-wrap gap-2 mt-3">
              <span *ngFor="let tech of project.stack" class="text-xs font-mono bg-brand-500/10 text-brand-300 rounded-md px-2.5 py-1">
                {{ tech }}
              </span>
            </div>
          </div>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 flex-shrink-0 text-brand-300 transition-transform duration-300"
            [class.rotate-180]="isExpanded(project.id)"
            fill="none" viewBox="0 0 24 24" stroke="currentColor"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <div
          class="grid transition-all duration-300 ease-in-out"
          [ngClass]="isExpanded(project.id) ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'"
        >
          <div class="overflow-hidden">
            <ul class="px-6 pb-6 space-y-2 border-t border-white/5 pt-4">
              <li *ngFor="let bullet of project.bullets[langService.currentLang()]" class="flex gap-3 text-slate-300 text-sm leading-relaxed">
                <span class="text-brand-400 mt-1">▸</span>
                <span>{{ bullet }}</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
