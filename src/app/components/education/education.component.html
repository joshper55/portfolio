<section id="education" class="max-w-6xl mx-auto px-6 py-24">
  <div appScrollReveal>
    @if (langService.currentLang() === 'es') {
      <p class="font-mono text-brand-400 text-sm mb-2">05. Educación</p>
      <h2 class="text-3xl sm:text-4xl font-bold text-white mb-10">Formación académica</h2>
    } @else {
      <p class="font-mono text-brand-400 text-sm mb-2">05. Education</p>
      <h2 class="text-3xl sm:text-4xl font-bold text-white mb-10">Academic Background</h2>
    }

    <div class="grid sm:grid-cols-2 gap-6">
      <div *ngFor="let edu of education" class="bg-ink-800 border border-white/10 rounded-2xl p-6">
        <p class="font-mono text-xs text-brand-400">{{ edu.period }}</p>
        <h3 class="text-lg font-bold text-white mt-1">{{ edu.school }}</h3>
        <p class="text-slate-300 text-sm mt-1">{{ edu.degree[langService.currentLang()] }}</p>
        <p class="text-slate-500 text-xs mt-2">{{ edu.location }}</p>
      </div>
    </div>
  </div>
</section>
