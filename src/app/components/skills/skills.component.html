<section id="skills" class="bg-ink-800/50 border-y border-white/5">
  <div class="max-w-6xl mx-auto px-6 py-24" appScrollReveal>
    @if (langService.currentLang() === 'es') {
      <p class="font-mono text-brand-400 text-sm mb-2">02. Habilidades</p>
      <h2 class="text-3xl sm:text-4xl font-bold text-white mb-10">Stack técnico</h2>
    } @else {
      <p class="font-mono text-brand-400 text-sm mb-2">02. Skills</p>
      <h2 class="text-3xl sm:text-4xl font-bold text-white mb-10">Technical Stack</h2>
    }

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let group of skills" class="bg-ink-900 border border-white/10 rounded-2xl p-6 hover:border-brand-500/50 transition-colors">
        <h3 class="text-brand-300 font-semibold mb-4">
          {{ group.category[langService.currentLang()] }}
        </h3>
        <div class="flex flex-wrap gap-2">
          <span *ngFor="let item of group.items" class="text-xs font-mono bg-white/5 text-slate-300 rounded-md px-2.5 py-1.5">
            {{ item }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
